<!DOCTYPE html>
<html>
<head>
    <title>Valedictorian Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Valedictorian Calculator</h1>

<label>GPA (0.00 - 4.3)</label>
<input type="number" id="gpa" step="0.01">

<label>Advanced Credits (0 - 16)</label>
<input type="number" id="adv">

<label>Total Credits (1 - 32)</label>
<input type="number" id="tot">

<label>ACT Composition Score (1 - 36)</label>
<input type="number" id="act">

<button onclick="calculateScore()">Calculate</button>

<p id="result"></p>

<script>

function calculateScore() {

    let GPA = Number(document.getElementById("gpa").value);
    let ADV_c = Number(document.getElementById("adv").value);
    let TOT_c = Number(document.getElementById("tot").value);
    let ACT = Number(document.getElementById("act").value);

    if (
        GPA < 0 ||
        GPA > 4.3 ||
        ADV_c < 0 ||
        ADV_c > 16 ||
        TOT_c < 1 ||
        TOT_c > 32 ||
        ACT < 1 ||
        ACT > 36
    ) {

        document.getElementById("result").innerHTML =
            "One of your values is invalid";

        return;
    }

    let Score =
        ((GPA / 4.3) * 0.5) +
        ((ADV_c / 16) * 0.3) +
        ((TOT_c / 32) * 0.1) +
        ((ACT / 36) * 0.1);

    document.getElementById("result").innerHTML =
        "Your Valedictorian Value Score is: " +
        (Score * 100).toFixed(2);
}

</script>

</body>
</html>
